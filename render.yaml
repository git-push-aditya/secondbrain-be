services:
  - type: web
    name: secondbrain-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:web
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BASE_LINK
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: EMBED_API_KEY
        sync: false
      - key: PINECONE_VDB_API_KEY
        sync: false

  - type: worker
    name: secondbrain-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:worker
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EMBED_API_KEY
        sync: false
      - key: PINECONE_VDB_API_KEY
        sync: false
